<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Christoffer Landberg</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #f2f5fb;
    --ink: #10182b;
    --ink-soft: #5b6572;
    --accent: #1c4f9c;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, sans-serif;
    text-align: center;
    padding: 24px;
  }

  .wrap { max-width: 440px; }

  h1 { margin: 0 0 8px; font-size: 1.7rem; font-weight: 800; }

  p { margin: 0; color: var(--ink-soft); font-size: 1rem; }

  .bar {
    width: 48px;
    height: 4px;
    background: var(--accent);
    border-radius: 2px;
    margin: 18px auto 22px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Christoffer Landberg</h1>
    <div class="bar"></div>
    <p>Sidan byggs om just nu &ndash; tillbaka snart.</p>
  </div>
</body>
</html>
